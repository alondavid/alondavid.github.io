<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Alon David. Father, builder, talks politics.">
  <title>Alon David</title>
  <style>
    :root { color-scheme: dark; --ground: #141516; --ink: #edeeeb; --muted: #a8aaa5; --rule: #333633; --accent: #b7cfab; }
    * { box-sizing: border-box; }
    html { background: var(--ground); }
    body { margin: 0; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(100% - 56px, 560px); margin: 0 auto; padding: clamp(88px, 17vh, 160px) 0 72px; }
    h1 { margin: 0 0 18px; font-size: clamp(32px, 4vw, 40px); font-weight: 550; letter-spacing: -.045em; line-height: 1.15; }
    .identity { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .identity span { white-space: nowrap; }
    .identity i { padding: 0 9px; font-style: normal; color: #7c8378; }
    .intro { margin: 64px 0 50px; max-width: 500px; }
    .intro p { margin: 0; font-size: clamp(23px, 3vw, 28px); line-height: 1.5; letter-spacing: -.025em; font-weight: 400; text-wrap: pretty; }
    .intro p + p { margin-top: 22px; color: var(--muted); font-size: 17px; line-height: 1.75; letter-spacing: -.01em; }
    nav { border-top: 1px solid var(--rule); }
    nav a { display: flex; justify-content: space-between; align-items: center; min-height: 62px; gap: 24px; padding: 17px 0; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.8; }
    nav a span { text-underline-offset: 5px; text-decoration-thickness: 1px; }
    nav a svg { width: 17px; height: 17px; color: var(--muted); flex: none; transition: transform 160ms ease, color 160ms ease; }
    nav a:hover { color: var(--accent); }
    nav a:hover span { text-decoration: underline; }
    nav a:hover svg { color: var(--accent); transform: translate(2px, -2px); }
    nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 2px; }
    @media (max-width: 480px) { main { padding-top: 80px; } .intro { margin-top: 48px; margin-bottom: 38px; } .identity { font-size: 13px; } .identity i { padding: 0 5px; } }
    @media (prefers-reduced-motion: reduce) { nav a svg { transition: none; } nav a:hover svg { transform: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Alon David</h1>
      <p class="identity"><span>Father</span><i aria-hidden="true">·</i><span>Builder</span><i aria-hidden="true">·</i><span>Talks politics</span></p>
    </header>
    <section class="intro" aria-label="Introduction">
      <p>I build with AI.</p>
    </section>
    <nav aria-label="Find me online">
      <a href="https://twitter.com/alondavid"><span>X / Twitter</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></a>
      <a href="https://github.com/alondavid"><span>GitHub</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></a>
      <a href="https://il.linkedin.com/in/alondavid"><span>LinkedIn</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></a>
    </nav>
  </main>
</body>
</html>
